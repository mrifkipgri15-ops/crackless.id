let mvT='list',mvF={m:'',t:''};
const mnm=id=>(S.mat.find(m=>m.id==id)||{n:'(dihapus)'}).n,dt=d=>new Date(d).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
const mst=m=>m.stok<=0?{t:'Habis',c:'x'}:m.min>0&&m.stok<=m.min?{t:'Menipis',c:'w'}:{t:'Aman',c:'ok'};
function addMv(m,t,q,note,price){m.stok=Math.round((m.stok+q)*1000)/1000;S.mv.unshift({id:Date.now()+Math.random(),d:new Date().toISOString(),t,mid:m.id,q,after:m.stok,note:note||'',by:user?user.u:'',price:price||0})}
function matTab(){const T=[['list','Bahan'],['prd','Produk jadi'],['log','Riwayat'],['opn','Opname'],['rep','Laporan stok']],G={list:['list'],prd:['prd'],log:['log','plv'],opn:['opn','pop'],rep:['rep']},sw=mvT=='log'||mvT=='plv'?[['log','Bahan'],['plv','Produk']]:mvT=='opn'||mvT=='pop'?[['opn','Bahan'],['pop','Produk']]:null;

$('#mb').innerHTML=`<div class="kpi"><div>Jenis material<b>${M.length}</b></div><div>Nilai stok<b>${rp(nv)}</b></div><div>Menipis<b>${M.filter(m=>mst(m).c=='w').length}</b></div><div>Habis<b>${M.filter(m=>mst(m).c=='x').length}</b></div></div><div class="row n"><button class="btn" onclick="mfm()">+ Material</button><button class="btn o" onclick="share(matText(),'Bagikan sisa stok material')">Bagikan sisa stok ke WA</button>${exb('mat')}<button class="btn o s" onclick="IK='mat';$('#imf').click()">Impor Excel/CSV</button>${M.length?'':'<button class="btn o" onclick="mSeed()">Isi dari Master HPP</button>'}</div>${pendNote()}<p style="color:var(--mut);margin-top:12px;max-width:62ch">Stok bahan berkurang otomatis setiap produk yang memakai bahan ini terjual. Resep bahan diatur di menu Produk & HPP.</p>`+(M.length?`<div class="tw" style="margin-top:14px"><table><tr><th>Material</th><th>Stok</th><th>Min</th><th>Harga/unit</th><th>Nilai</th><th>Dipakai di (HPP)</th><th>Status</th><th></th></tr>${M.map(m=>{const s=mst(m);return`<tr><td>${esc(m.n)}${m.sup?`<br><small style="color:var(--mut)">${esc(m.sup)}</small>`:''}</td><td><b>${m.stok}</b> ${esc(m.u)}</td><td>${m.min}</td><td>${rp(m.cost)}</td><td>${rp(m.stok*m.cost)}</td><td><small>${usedIn(m)}</small></td><td><span class="pill ${s.c=='ok'?'f':''}">${s.t}</span></td><td><div class="row n"><button class="btn o s" onclick="mmv(${m.id},'in')">Masuk</button><button class="btn o s" onclick="mmv(${m.id},'out')">Keluar</button><button class="btn o s" onclick="mfm(${m.id})">Edit</button>${mg()?`<button class="btn o s" onclick="mdel(${m.id})">Hapus</button>`:''}</div></td></tr>`}).join('')}</table></div>`:'<p style="margin-top:14px;color:var(--mut)">Belum ada material. Tambahkan manual, impor dari Excel, atau isi dari Master HPP.</p>')}
const usedIn=m=>S.products.flatMap(p=>(p.costs||[]).filter(c=>c.t=='m'&&c.mid==m.id).map(c=>esc(p.n)+' ×'+(c.m||1))).join('<br>')||'<span style="color:var(--mut)">belum dihubungkan</span>';
function mSeed(){S.master.forEach((c,i)=>S.mat.push({id:Date.now()+i,n:c.n,u:'pcs',stok:0,min:0,cost:0,sup:''}));save();mList()}
function mfm(id){const m=S.mat.find(x=>x.id==id)||{n:'',u:'pcs',stok:0,min:0,cost:0,sup:''};
$('#mb').innerHTML=`<h3>${id?'Edit':'Tambah'} material</h3><div class="fr" style="max-width:640px"><input id="mn" placeholder="Nama material (mis. Plastik packing, Kain cotton 24s)" value="${esc(m.n)}"><div class="row"><label>Satuan<input id="mu" value="${esc(m.u)}" list="ul"></label><label>Min. stok (alarm)<input id="mi" inputmode="decimal" value="${m.min}"></label><label>Harga beli per satuan (Rp)<input id="mc" inputmode="numeric" value="${fmt(m.cost)}" oninput="nf(this)"></label></div>${id?'':'<label>Stok awal<input id="ms" inputmode="decimal" value="0"></label>'}<label>Supplier / sumber (opsional)<input id="mp" value="${esc(m.sup)}"></label><datalist id="ul"><option>pcs<option>pak<option>roll<option>meter<option>kg<option>lembar</datalist><small style="color:var(--mut)">${id?'Jumlah stok diubah lewat Masuk, Keluar, atau Stok opname supaya tercatat di riwayat.':''}</small></div><div class="row n"><button class="btn" id="msv">Simpan</button><button class="btn o" onclick="matTab()">Batal</button></div>`;
$('#msv').onclick=()=>{const n=$('#mn').value.trim();if(!n)return toast('Nama wajib diisi');const d={n,u:$('#mu').value.trim()||'pcs',min:num($('#mi').value),cost:num($('#mc').value),sup:$('#mp').value.trim()};if(id)Object.assign(m,d);else{const nm={id:Date.now(),stok:0,...d};S.mat.push(nm);const s0=num($('#ms').value);if(s0>0)addMv(nm,'in',s0,'Stok awal',s0*nm.cost)}save();matTab()}}
function mmv(id,t){const m=S.mat.find(x=>x.id==id),I=t=='in';
$('#mb').innerHTML=`<h3>${I?'Barang masuk':'Barang keluar'}: ${esc(m.n)}</h3><p style="color:var(--mut)">Stok sekarang ${m.stok} ${esc(m.u)}</p><div class="fr" style="max-width:520px"><label>Jumlah (${esc(m.u)})<input id="vq" inputmode="decimal"></label>${I?'<label>Total harga beli (Rp, opsional, untuk menghitung harga rata-rata)<input id="vp" inputmode="numeric" oninput="nf(this)"></label>':''}<label>Catatan (${I?'supplier / no. nota':'dipakai untuk apa, mis. produksi batch 3'})<input id="vn"></label></div><div class="row n"><button class="btn" id="vs">Simpan</button><button class="btn o" onclick="matTab()">Batal</button></div>`;
$('#vs').onclick=()=>{const q=num($('#vq').value);if(!(q>0))return toast('Jumlah tidak valid');if(!I&&q>m.stok)return toast('Stok tidak cukup (sisa '+m.stok+')');let pr=0;if(I){pr=num($('#vp').value);if(pr>0)m.cost=Math.round((m.stok*m.cost+pr)/(m.stok+q))}addMv(m,t,I?q:-q,$('#vn').value.trim(),pr);save();toast('Tercatat');matTab()}}
function mdel(id){dlg('Hapus material ini? Riwayat mutasinya tetap tersimpan.',0,()=>{alog('Hapus material',mnm(id));S.mat=S.mat.filter(m=>m.id!=id);save();matTab()})}
function mLog(){const L=fl().slice(0,300);
$('#mb').innerHTML=`<div class="row n" style="justify-content:space-between;width:100%"><span style="color:var(--mut)">${L.length} mutasi</span><div class="row n">${exb('log')}</div></div>${rbar('mLog')}<div class="row" style="max-width:560px"><select onchange="mvF.m=this.value;mLog()"><option value="">Semua material</option>${S.mat.map(m=>`<option value="${m.id}" ${mvF.m==m.id?'selected':''}>${esc(m.n)}</option>`).join('')}</select><select onchange="mvF.t=this.value;mLog()">${[['','Semua jenis'],['in','Masuk'],['out','Keluar'],['adj','Opname']].map(x=>`<option value="${x[0]}" ${mvF.t==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>`+(L.length?`<div class="tw" style="margin-top:14px"><table><tr><th>Waktu</th><th>Material</th><th>Jenis</th><th>Jumlah</th><th>Saldo</th><th>Catatan</th><th>Oleh</th></tr>${L.map(x=>`<tr><td>${dt(x.d)}</td><td>${esc(mnm(x.mid))}</td><td><span class="pill ${x.t=='in'?'f':''}">${{in:'MASUK',out:'KELUAR',adj:'OPNAME'}[x.t]}</span></td><td><b>${x.q>0?'+':''}${x.q}</b></td><td>${x.after}</td><td>${esc(x.note)}</td><td>${esc(x.by)}</td></tr>`).join('')}</table></div>`:'<p style="margin-top:14px;color:var(--mut)">Belum ada mutasi untuk filter ini.</p>')}

/* ===== filter, laporan, ekspor/impor, pemakaian material ===== */
let RF={p:'all',a:'',b:''},OF={q:'',s:'',p:''},IK='';
const RL={all:'Semua',today:'Hari ini','7':'7 hari','30':'30 hari',month:'Bulan ini',custom:'Pilih tanggal'},rlab=()=>RF.p=='custom'?(RF.a||'…')+' s/d '+(RF.b||'…'):RL[RF.p];
function inR(iso){const d=new Date(iso),n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let a=null,b=null;if(RF.p=='today')a=t0;else if(RF.p=='7'){a=new Date(t0);a.setDate(a.getDate()-6)}else if(RF.p=='30'){a=new Date(t0);a.setDate(a.getDate()-29)}else if(RF.p=='month')a=new Date(n.getFullYear(),n.getMonth(),1);else if(RF.p=='custom'){a=RF.a?new Date(RF.a+'T00:00:00'):null;b=RF.b?new Date(RF.b+'T23:59:59'):null}return(!a||d>=a)&&(!b||d<=b)}
const rbar=fn=>`<div class="row n" style="margin:12px 0">${Object.keys(RL).map(k=>`<button class="chip ${RF.p==k?'on':''}" onclick="RF.p='${k}';${fn}()">${RL[k]}</button>`).join('')}${RF.p=='custom'?`<input type="date" style="width:auto" value="${RF.a}" onchange="RF.a=this.value;${fn}()"><input type="date" style="width:auto" value="${RF.b}" onchange="RF.b=this.value;${fn}()">`:''}</div>`;
const ps=o=>o.paid>=o.total?'lunas':o.paid>0?'dp':'belum';
const fo=()=>S.orders.map((o,i)=>({o,i})).filter(({o})=>inR(o.date)&&(!OF.s||ps(o)==OF.s)&&(!OF.p||o.fs==OF.p)&&(!OF.q||(o.no+o.cust.nm+o.cust.hp).toLowerCase().includes(OF.q.toLowerCase())));
const fl=()=>S.mv.filter(x=>inR(x.d)&&(!mvF.m||x.mid==mvF.m)&&(!mvF.t||x.t==mvF.t));
function fsx(i,v){const o=S.orders[i];o.fs=v;alog('Status pesanan',o.no+' → '+v);save();toast('Status diperbarui')}
/* pemakaian material */
function useP(p,q,ref){let n=0;(p.costs||[]).filter(c=>c.t=='m').forEach(c=>{const m=S.mat.find(x=>x.id==c.mid);if(!m)return;addMv(m,'out',-(+c.m||1)*q,'Pemakaian '+ref+' · '+p.n+' x'+q);n++});return n}
function useO(o){if(o.used)return 0;const u=[];o.items.forEach(i=>{const p=S.products.find(x=>x.id==i.id);if(!p)return;(p.costs||[]).filter(c=>c.t=='m').forEach(c=>{const m=S.mat.find(x=>x.id==c.mid);if(!m)return;const q=(+c.m||1)*i.q;addMv(m,'out',-q,'Pemakaian '+o.no+' · '+i.n+' x'+i.q);u.push({mid:m.id,q})})});if(u.length){o.used=true;o.uu=u}return u.length}
function revO(o){if(!o.used)return;if(o.uu){o.uu.forEach(x=>{const m=S.mat.find(y=>y.id==x.mid);if(m)addMv(m,'in',x.q,'Batal '+o.no)})}else o.items.forEach(i=>{const p=S.products.find(x=>x.id==i.id);if(!p)return;(p.costs||[]).filter(c=>c.t=='m').forEach(c=>{const m=S.mat.find(x=>x.id==c.mid);if(m)addMv(m,'in',(+c.m||1)*i.q,'Batal '+o.no)})});o.used=false;o.uu=[]}
const hasLn=o=>o.items.some(i=>{const p=S.products.find(x=>x.id==i.id);return p&&(p.costs||[]).some(c=>c.t=='m'&&S.mat.some(m=>m.id==c.mid))});
const pend=()=>S.orders.filter(o=>!o.used&&hasLn(o));
const bhn=o=>o.used?'<br><small style="color:var(--mut)">bahan terpotong</small>':hasLn(o)?'<br><small style="color:var(--mut)">bahan belum dipotong</small>':'';

function custTab(){const C=custs();$('#oB').innerHTML=`<div class="row n" style="justify-content:space-between;width:100%"><h1 style="font-size:46px">Pelanggan</h1><div class="row n">${exb('cust')}<button class="btn o s" onclick="cCopy()">Salin semua nomor</button></div></div>${rbar('custTab')}<div class="row" style="max-width:760px"><input placeholder="Cari nama / nomor" value="${esc(CF.q)}" onchange="CF.q=this.value;custTab()"><select onchange="CF.s=this.value;custTab()">${[['','Semua pelanggan'],['baru','Pelanggan baru (1x)'],['setia','Setia (3x atau lebih)'],['piutang','Punya piutang'],['po','Pernah PO']].map(x=>`<option value="${x[0]}" ${CF.s==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><p style="color:var(--mut);margin-top:10px">${C.length} pelanggan · total belanja ${rp(C.reduce((a,c)=>a+c.tot,0))}</p>`+(C.length?`<div class="tw"><table><tr><th>Pelanggan</th><th>Pesanan</th><th>Total belanja</th><th>Piutang</th><th>Terakhir</th><th></th></tr>${C.map(c=>`<tr><td><b>${esc(c.nm)}</b><br><small>${esc(c.hp)}</small>${S.cn[c.k]?`<br><small style="color:var(--mut)">${esc(S.cn[c.k])}</small>`:''}</td><td>${c.n}${c.po?` <small>(${c.po} PO)</small>`:''}</td><td>${rp(c.tot)}</td><td>${rp(c.piu)}</td><td>${new Date(c.last).toLocaleDateString('id-ID')}</td><td><div class="row n"><button class="btn o s" onclick="cDet('${c.k}')">Riwayat</button><button class="btn o s" onclick="cWa('${c.k}')">Kirim promo</button></div></td></tr>`).join('')}</table></div>`:'<p style="margin-top:14px;color:var(--mut)">Belum ada pelanggan untuk filter ini.</p>')}
function cCopy(){const t=custs().map(c=>c.k).join('\n');try{navigator.clipboard.writeText(t);toast('Nomor disalin')}catch(e){share(t,'Daftar nomor','')}}
function cWa(k){const c=custs().find(x=>x.k==k);share(fill(S.tpl.promo,{nama:c.nm,toko:S.cfg.brand,link:link()}),'Kirim promo ke '+c.nm,c.k)}
function cDet(k){const O=S.orders.filter(o=>kn(o.cust.hp)==k),c=O[0];if(!c){custTab();return}
$('#oB').innerHTML=`<button class="btn o s" onclick="custTab()">← Kembali</button><h1 style="font-size:40px;margin-top:12px">${esc(c.cust.nm)}</h1><p style="color:var(--mut)">${esc(c.cust.hp)} · ${esc(c.cust.al)}</p><div class="kpi"><div>Pesanan<b>${O.length}</b></div><div>Total belanja<b>${rp(O.reduce((a,o)=>a+o.total-(o.ongkir||0),0))}</b></div><div>Piutang<b>${rp(O.reduce((a,o)=>a+o.total-o.paid,0))}</b></div></div><label style="max-width:560px">Catatan pelanggan (ukuran favorit, preferensi, dll.)<textarea id="cnt" rows="2">${esc(S.cn[k]||'')}</textarea></label><div class="row n" style="margin:10px 0"><button class="btn" onclick="S.cn['${k}']=$('#cnt').value.trim();alog('Catatan pelanggan','${k}');save();toast('Tersimpan')">Simpan catatan</button><button class="btn o" onclick="cWa('${k}')">Kirim promo</button></div><h3>Riwayat belanja</h3><div class="tw"><table><tr><th>Invoice</th><th>Tanggal</th><th>Barang</th><th>Total</th><th>Status</th></tr>${O.map(o=>`<tr><td>${esc(o.no)}</td><td>${new Date(o.date).toLocaleDateString('id-ID')}</td><td>${o.items.map(i=>esc(i.n)+' x'+i.q).join(', ')}</td><td>${rp(o.total)}</td><td><span class="pill ${o.paid>=o.total?'f':''}">${st(o)}</span></td></tr>`).join('')}</table></div>`}
/* --- voucher --- */
function vcTab(){$('#oB').innerHTML=`<div class="row n" style="justify-content:space-between;width:100%"><h1 style="font-size:46px">Voucher & diskon</h1><button class="btn" onclick="vcf()">+ Voucher</button></div>`+(S.vc.length?`<div class="tw" style="margin-top:14px"><table><tr><th>Kode</th><th>Diskon</th><th>Syarat</th><th>Terpakai</th><th>Status</th><th></th></tr>${S.vc.map((v,i)=>`<tr><td><b>${esc(v.code)}</b></td><td>${v.t=='p'?v.v+'%':rp(v.v)}</td><td><small>${v.min?'min. '+rp(v.min)+'<br>':''}${v.sc=='all'?'semua barang':v.sc=='po'?'barang PO':'barang ready'}${v.exp?'<br>sampai '+esc(v.exp):''}</small></td><td>${v.used||0}${v.max?' / '+v.max:''}</td><td><span class="pill ${v.on?'f':''}">${v.on?'AKTIF':'MATI'}</span></td><td><div class="row n"><button class="btn o s" onclick="vct(${i})">${v.on?'Matikan':'Aktifkan'}</button><button class="btn o s" onclick="vcf(${i})">Edit</button><button class="btn o s" onclick="vcs(${i})">Bagikan</button><button class="btn o s" onclick="vcd(${i})">Hapus</button></div></td></tr>`).join('')}</table></div>`:'<p style="margin-top:14px;color:var(--mut)">Belum ada voucher. Contoh: kode PO10 diskon 10% khusus barang PO.</p>')}
function vct(i){S.vc[i].on=!S.vc[i].on;alog('Voucher',S.vc[i].code+(S.vc[i].on?' diaktifkan':' dimatikan'));save();vcTab()}
function vcs(i){const v=S.vc[i];share(`🎁 ${S.cfg.brand}\nPakai kode *${v.code}* untuk diskon ${v.t=='p'?v.v+'%':rp(v.v)}${v.min?' (min. belanja '+rp(v.min)+')':''}${v.exp?'\nBerlaku sampai '+v.exp:''}\nBelanja di ${link()}`,'Bagikan voucher')}
function vcd(i){dlg('Hapus voucher '+S.vc[i].code+'?',0,()=>{alog('Hapus voucher',S.vc[i].code);S.vc.splice(i,1);save();vcTab()})}
function vcf(i){const v=S.vc[i]||{code:'',t:'p',v:10,min:0,max:0,exp:'',sc:'all'},o=(a,b,c)=>`<option value="${a}" ${c==a?'selected':''}>${b}</option>`;
$('#oB').innerHTML=`<h1 style="font-size:40px">${S.vc[i]?'Edit':'Tambah'} voucher</h1><div class="fr" style="max-width:640px"><label>Kode voucher<input id="vk" value="${esc(v.code)}" style="text-transform:uppercase"></label><div class="row"><label>Jenis<select id="vt">${o('p','Persen (%)',v.t)}${o('n','Nominal (Rp)',v.t)}</select></label><label>Nilai<input id="vv" inputmode="numeric" value="${fmt(v.v)}" oninput="nf(this)"></label></div><div class="row"><label>Minimal belanja (Rp)<input id="vm" inputmode="numeric" value="${fmt(v.min)}" oninput="nf(this)"></label><label>Kuota pemakaian (0 = tanpa batas)<input id="vx" inputmode="numeric" value="${v.max||0}"></label></div><div class="row"><label>Berlaku untuk<select id="vsc">${o('all','Semua barang',v.sc)}${o('ready','Barang ready',v.sc)}${o('po','Barang PO (diskon batch PO)',v.sc)}</select></label><label>Kedaluwarsa (opsional)<input id="ve" type="date" value="${v.exp||''}"></label></div></div><div class="row n"><button class="btn" id="vsv">Simpan</button><button class="btn o" onclick="vcTab()">Batal</button></div>`;
$('#vsv').onclick=()=>{const code=$('#vk').value.trim().toUpperCase();if(!code)return toast('Kode wajib diisi');if(S.vc.some((x,j)=>x.code==code&&j!=i))return toast('Kode sudah dipakai');const d={code,t:$('#vt').value,v:num($('#vv').value),min:num($('#vm').value),max:num($('#vx').value),sc:$('#vsc').value,exp:$('#ve').value};if(d.t=='p'&&(d.v<=0||d.v>100))return toast('Persen harus 1 sampai 100');if(d.v<=0)return toast('Nilai wajib diisi');if(S.vc[i])Object.assign(S.vc[i],d);else S.vc.push({...d,on:true,used:0});alog('Simpan voucher',code);save();vcTab()}}
/* --- biaya & laba rugi --- */
const EC=['Iklan','Gaji','Sewa','Listrik & internet','Packing & operasional','Transport','Lainnya'];
function finCalc(){const O=S.orders.filter(o=>inR(o.date)),sale=O.reduce((a,o)=>a+o.items.reduce((s,i)=>s+i.price*i.q,0)-(o.disc||0),0),hp=O.reduce((a,o)=>a+o.items.reduce((s,i)=>s+i.hpp*i.q,0),0),E=S.exp.filter(e=>inR(e.d+'T12:00:00')),eb=E.reduce((a,e)=>a+e.v,0),cat={};E.forEach(e=>cat[e.c]=(cat[e.c]||0)+e.v);return{O,E,sale,hp,gp:sale-hp,eb,cat,net:sale-hp-eb,paid:O.reduce((a,o)=>a+o.paid,0),piu:O.reduce((a,o)=>a+o.total-o.paid,0)}}
function finText(){const f=finCalc();return `*LAPORAN LABA RUGI ${S.cfg.brand}*\nPeriode: ${rlab()}\n\nPenjualan bersih: ${rp(f.sale)}\nHPP: ${rp(f.hp)}\nLaba kotor: ${rp(f.gp)}\n\n*Biaya operasional*\n${Object.keys(f.cat).length?Object.entries(f.cat).map(([k,v])=>k+': '+rp(v)).join('\n'):'-'}\nTotal biaya: ${rp(f.eb)}\n\n*Laba bersih: ${rp(f.net)}*\nUang diterima: ${rp(f.paid)}\nPiutang: ${rp(f.piu)}`}
function finTab(){const f=finCalc();
$('#oB').innerHTML=`<div class="row n" style="justify-content:space-between;width:100%"><h1 style="font-size:46px">Biaya & laba rugi</h1><div class="row n"><button class="btn" onclick="share(finText(),'Bagikan laba rugi ke WhatsApp')">Bagikan ke WA</button>${exb('fin')}</div></div>${rbar('finTab')}<div class="kpi"><div>Penjualan bersih<b data-n="${f.sale}" data-r="1"></b></div><div>HPP<b data-n="${f.hp}" data-r="1"></b></div><div>Laba kotor<b data-n="${f.gp}" data-r="1"></b></div><div>Biaya operasional<b data-n="${f.eb}" data-r="1"></b></div><div>Laba bersih<b data-n="${f.net}" data-r="1"></b></div><div>Uang diterima<b data-n="${f.paid}" data-r="1"></b></div></div><div class="cols"><div class="pn"><h3>Biaya per kategori</h3>${Object.keys(f.cat).length?Object.entries(f.cat).map(([k,v])=>`<div class="st"><span>${esc(k)}</span><b>${rp(v)}</b></div>`).join(''):'<small style="color:var(--mut)">Belum ada biaya di periode ini.</small>'}</div><div class="pn"><h3>Catat biaya</h3><div class="fr"><div class="row"><input id="xd" type="date" value="${td()}"><select id="xc">${EC.map(c=>`<option>${c}</option>`).join('')}</select></div><input id="xn" placeholder="Keterangan (mis. iklan IG minggu 1)"><input id="xv" inputmode="numeric" placeholder="Jumlah (Rp)" oninput="nf(this)"><button class="btn" onclick="xAdd()">Simpan biaya</button></div></div></div>`+(f.E.length?`<div class="row n" style="justify-content:space-between;width:100%"><h3>Daftar biaya</h3>${exb('exp')}</div><div class="tw"><table><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th></th></tr>${f.E.map(e=>`<tr><td>${esc(e.d)}</td><td>${esc(e.c)}</td><td>${esc(e.n)}</td><td>${rp(e.v)}</td><td><button class="btn o s" onclick="xDel(${e.id})">Hapus</button></td></tr>`).join('')}</table></div>`:'');countUp()}
function xAdd(){const v=num($('#xv').value);if(!(v>0))return toast('Jumlah tidak valid');S.exp.unshift({id:Date.now(),d:$('#xd').value||td(),c:$('#xc').value,n:$('#xn').value.trim(),v,by:user.u});alog('Catat biaya',$('#xc').value+' '+rp(v));save();toast('Biaya tersimpan');finTab()}
function xDel(id){dlg('Hapus catatan biaya ini?',0,()=>{const e=S.exp.find(x=>x.id==id);if(e)alog('Hapus biaya',e.c+' '+rp(e.v));S.exp=S.exp.filter(x=>x.id!=id);save();finTab()})}
/* --- absen karyawan --- */
const eNm=id=>(S.emp.find(e=>e.id==id)||{n:'(dihapus)'}).n,arec=(e,d)=>S.att.find(a=>a.eid==e&&a.date==d);
const lm=r=>{if(!r||!r.in)return 0;const d=new Date(r.in),[h,m]=(S.cfg.workStart||'09:00').split(':').map(Number);return Math.max(0,d.getHours()*60+d.getMinutes()-(h*60+m))};
function attSt(e,s){const r=arec(e,td());if(r){r.st=s;r.in=null;r.out=null}else S.att.push({id:Date.now()+Math.random(),eid:e,date:td(),st:s,in:null,out:null});alog('Absen '+s,eNm(e));save();absTab()}
function absTab(){const T=[['today','Hari ini'],['hist','Riwayat & manual'],['rekap','Rekap bulanan'],['emp','Karyawan & pengaturan']];
$('#oB').innerHTML=`<h1 style="font-size:46px">Absen karyawan</h1><div class="row n" style="margin:14px 0">${T.map(x=>`<button class="chip ${AT==x[0]?'on':''}" onclick="AT='${x[0]}';absTab()">${x[1]}</button>`).join('')}</div><div id="ab"></div>`;({today:aToday,hist:aHist,rekap:aRekap,emp:aEmp})[AT]()}
function dist(a,b,c,d){const t=x=>x*Math.PI/180,h=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return Math.round(12742000*Math.asin(Math.sqrt(h)))}
let AP={ph:'',loc:null};
function geoGet(){const el=$('#aloc');if(S.cfg.attGeo=='off'){el.textContent='Pengecekan lokasi dinonaktifkan oleh manager';return}if(!navigator.geolocation){el.textContent='Perangkat tidak mendukung lokasi';return}
navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,ln=p.coords.longitude;let d=null,ok=null;if(S.cfg.attLat!==''&&S.cfg.attLng!==''){d=dist(+S.cfg.attLat,+S.cfg.attLng,la,ln);ok=d<=(+S.cfg.attRad||100)}AP.loc={lat:la,lng:ln,d,ok};el.textContent=ok===null?'Lokasi tercatat (titik kantor belum diatur manager)':ok?'✓ Dalam area kantor ('+d+' m dari titik)':'✗ Di luar area kantor ('+d+' m dari titik)'},er=>{el.textContent='Lokasi tidak tersedia ('+(er.code==1?'izin lokasi ditolak':'gagal mendapatkan lokasi')+')'},{timeout:9000,enableHighAccuracy:true})}
function attForm(e,k){if(!S.cfg.attOn)return toast('Absen sedang dinonaktifkan');const r=arec(e,td());if(k=='in'&&r&&r.in)return toast('Sudah absen masuk');if(k=='out'&&(!r||!r.in))return toast('Belum absen masuk');if(k=='out'&&r.out)return toast('Sudah absen pulang');AP={ph:'',loc:null};
$('#iB').innerHTML=`<h2>Absen ${k=='in'?'masuk':'pulang'}</h2><p style="color:var(--mut)">${esc(eNm(e))}</p><div class="fr">${S.cfg.attPhoto?`<label>Foto selfie${k=='in'?' (wajib)':''}<input id="aph" type="file" accept="image/*" capture="user"></label><img id="apv" alt="" style="max-width:100%;max-height:220px;display:none;object-fit:cover">`:''}<div id="aloc" style="font-size:13px;color:var(--mut)">Mencari lokasi…</div><input id="anote" placeholder="Catatan (opsional)"></div><div class="row n"><button class="btn" id="asv">Simpan absen</button><button class="btn o" data-x>Batal</button></div>`;$('#ovI').classList.add('on');
if(S.cfg.attPhoto)$('#aph').onchange=async ev=>{AP.ph=await shrink(ev.target.files[0],360)||'';const i=$('#apv');if(AP.ph){i.src=AP.ph;i.style.display='block'}};
geoGet();$('#asv').onclick=()=>attSave(e,k)}
function attSave(e,k){if(k=='in'&&S.cfg.attPhoto&&!AP.ph)return toast('Foto selfie wajib diambil');if(S.cfg.attGeo=='block'&&k=='in'){if(!AP.loc)return toast('Lokasi belum didapat. Aktifkan izin lokasi');if(AP.loc.ok===false)return toast('Kamu di luar area kantor, absen ditolak')}
const r=arec(e,td()),now=new Date().toISOString(),note=$('#anote').value.trim();
if(k=='in'){const d={st:'hadir',in:now,ph:AP.ph,loc:AP.loc,note,by:user?user.u:''};if(r)Object.assign(r,d,{out:null});else S.att.push({id:Date.now()+Math.random(),eid:e,date:td(),out:null,...d})}else{r.out=now;if(AP.ph)r.phO=AP.ph;if(AP.loc)r.locO=AP.loc;if(note)r.note=(r.note?r.note+' · ':'')+note}
attPrune();alog('Absen '+(k=='in'?'masuk':'pulang'),eNm(e)+(AP.loc&&AP.loc.ok===false?' (di luar area)':''));save();$('#ovI').classList.remove('on');absTab()}
function attPrune(){const lim=Date.now()-(+S.cfg.attKeep||14)*864e5;S.att.forEach(a=>{if(new Date(a.date+'T12:00:00')<lim){delete a.ph;delete a.phO}})}
function attText(){const E=S.emp.filter(e=>e.on!==false);return `*ABSEN ${S.cfg.brand}*\n${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\n\n`+(E.length?E.map(e=>{const r=arec(e.id,td());return '• '+e.n+': '+(r?(r.st=='hadir'?'Hadir '+(r.in?hm(r.in):'-')+(r.out?' - '+hm(r.out):'')+(lm(r)?' (telat '+lm(r)+' mnt)':'')+(r.loc&&r.loc.ok===false?' [luar area]':''):r.st.toUpperCase()):'Belum absen')}).join('\n'):'-')}
function attRekapText(){return `*REKAP ABSEN ${S.cfg.brand}*\nBulan ${AM}\n\n`+arc().map(r=>`• ${r.n}: hadir ${r.h}, telat ${r.tl}, izin ${r.iz}, sakit ${r.sk}, alpha ${r.al}, ${r.jam} jam`).join('\n')}
function aToday(){const E=S.emp.filter(e=>e.on!==false);$('#ab').innerHTML=`<div class="row n" style="justify-content:space-between;width:100%"><p style="color:var(--mut)">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · jam masuk standar ${esc(S.cfg.workStart)}</p><button class="btn o s" onclick="share(attText(),'Bagikan absen hari ini ke WhatsApp')">Bagikan ke WA</button></div>`+(E.length?`<div class="tw" style="margin-top:12px"><table><tr><th>Karyawan</th><th>Status</th><th>Masuk</th><th>Pulang</th><th></th></tr>${E.map(e=>{const r=arec(e.id,td()),l=lm(r);return`<tr><td><b>${esc(e.n)}</b><br><small>${esc(e.pos||'')}</small></td><td><span class="pill ${r&&r.st=='hadir'?'f':''}">${r?r.st.toUpperCase():'BELUM'}</span>${l?`<br><small>telat ${l} menit</small>`:''}${r&&r.loc&&r.loc.ok===false?'<br><small>di luar area</small>':''}</td><td>${r&&r.in?hm(r.in):'-'}</td><td>${r&&r.out?hm(r.out):'-'}</td><td><div class="row n"><button class="btn s" onclick="attForm(${e.id},'in')">Masuk</button><button class="btn o s" onclick="attForm(${e.id},'out')">Pulang</button><button class="btn o s" onclick="attSt(${e.id},'izin')">Izin</button><button class="btn o s" onclick="attSt(${e.id},'sakit')">Sakit</button></div></td></tr>`}).join('')}</table></div>`:'<p style="margin-top:12px;color:var(--mut)">Belum ada karyawan. Tambahkan di tab Karyawan & pengaturan.</p>')}

${S.cfg.attRad}" onchange="S.cfg.attRad=num(this.value)||100;save()"></label></div><div class="row n"><button class="btn o s" onclick="attHere()">Pakai lokasi saya sekarang sebagai titik kantor</button></div><label>Simpan foto absen selama (hari)<input inputmode="numeric" value="${S.cfg.attKeep}" onchange="S.cfg.attKeep=num(this.value)||14;save()"></label><small style="color:var(--mut)">Foto lama dihapus otomatis supaya penyimpanan browser tidak penuh. Catatan absennya tetap ada.</small></div>`:'<p style="margin-top:20px;color:var(--mut)">Pengaturan foto dan lokasi absen hanya bisa diubah oleh manager.</p>')}

function topSell(n){const m={};S.orders.forEach(o=>o.items.forEach(i=>m[i.id]=(m[i.id]||0)+i.q));let L=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([id,q])=>({p:S.products.find(x=>x.id==id),q})).filter(x=>x.p);if(L.length<n)avail().forEach(p=>{if(!L.some(x=>x.p.id==p.id))L.push({p,q:0})});return L.slice(0,n)}
function showPP(id,pv){const p=S.pp.find(x=>String(x.id)==String(id));if(!p)return;const L=p.kind=='laris'?topSell(3):[];
$('#pB').innerHTML=`<button class="btn s" data-x style="position:absolute;top:10px;right:10px;z-index:3" aria-label="Tutup">✕</button>${p.img?`<img src="${p.img}" alt="" style="width:100%;max-height:280px;object-fit:cover;display:block">`:''}<div class="pc"><span class="pill f">${p.kind=='flash'?'⚡ FLASH SALE':p.kind=='diskon'?'DISKON':p.kind=='laris'?'TERLARIS':'INFO'}</span><h2 style="font-size:40px;margin:10px 0">${esc(p.title)}</h2><p style="white-space:pre-wrap">${esc(p.body)}</p>${p.act=='voucher'&&p.code?`<p style="margin-top:10px">Kode: <b>${esc(p.code)}</b></p>`:''}${p.cd&&p.end?'<div id="ppc" style="font:800 36px \'Barlow Condensed\',sans-serif;margin:12px 0"></div>':''}${L.length?`<div style="margin-top:14px">${L.map(x=>`<div class="st" style="align-items:center"><span><b>${esc(x.p.n)}</b><br><small>${rp(x.p.price)}</small></span><button class="btn s" onclick="add(${x.p.id})">Tambah</button></div>`).join('')}</div>`:''}<div class="row n" style="margin-top:18px">${p.act!='none'?`<button class="btn" onclick="ppGo('${p.id}')">${esc(p.btn||'Lihat sekarang')}</button><button class="btn o" data-x>Nanti saja</button>`:'<button class="btn" data-x>Tutup</button>'}</div></div>`;
$('#ovP').classList.add('on');
if(p.cd&&p.end){const t=()=>{const e=$('#ppc');if(!e||!$('#ovP').classList.contains('on'))return;const d=Math.max(0,Math.floor((new Date(p.end)-Date.now())/1e3)),dd=Math.floor(d/86400),r2=d%86400,z=x=>String(x).padStart(2,'0');e.textContent=(dd?dd+' hari ':'')+z(Math.floor(r2/3600))+':'+z(Math.floor(r2%3600/60))+':'+z(r2%60);setTimeout(t,1000)};t()}
if(!pv){try{if(p.freq=='session')sessionStorage.setItem('pp_'+p.id,'1');if(p.freq=='day')localStorage.setItem('ppd_'+p.id,td())}catch(e){}}}
function ppGo(id){const p=S.pp.find(x=>String(x.id)==String(id));if($('#store').style.display=='none'){toast('Pratinjau: tombol ini akan '+({koleksi:'membuka daftar koleksi',produk:'membuka produk',voucher:'memakai voucher di keranjang'}[p.act]||'ditutup'));return}$('#ovP').classList.remove('on');if(p.act=='koleksi')$('#kat').scrollIntoView({behavior:'smooth'});else if(p.act=='produk'&&p.pid)go2(p.pid);else if(p.act=='voucher'){cvc=p.code||'';drawCart();$('#ovC').classList.add('on')}}
function ppSeen(p){try{return p.freq=='session'?!!sessionStorage.getItem('pp_'+p.id):p.freq=='day'?localStorage.getItem('ppd_'+p.id)==td():false}catch(e){return false}}
function ppAuto(){if($('#store').style.display==='none')return;const p=S.pp.find(x=>ppSt(x)=='tampil'&&!ppSeen(x));if(p)showPP(p.id)}

/* ===== laporan stok awal & akhir ===== */
let SK='mat';const r3=x=>Math.round(x*1000)/1000;
function rng(){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let a=null,b=null;if(RF.p=='today')a=t0;else if(RF.p=='7'){a=new Date(t0);a.setDate(a.getDate()-6)}else if(RF.p=='30'){a=new Date(t0);a.setDate(a.getDate()-29)}else if(RF.p=='month')a=new Date(n.getFullYear(),n.getMonth(),1);else if(RF.p=='custom'){a=RF.a?new Date(RF.a+'T00:00:00'):null;b=RF.b?new Date(RF.b+'T23:59:59'):null}return[a,b]}
function stkRep(kind){const [a,b]=rng(),M=kind=='mat'?S.mv:S.pv,id=kind=='mat'?'mid':'pid',I=kind=='mat'?S.mat.map(m=>({id:m.id,n:m.n,u:m.u,stok:m.stok,c:m.cost})):S.products.map(p=>({id:p.id,n:p.n,u:'pcs',stok:p.stok,c:hpp(p)}));
return I.map(x=>{let masuk=0,keluar=0,adj=0,after=0,inP=0;M.forEach(v=>{if(v[id]!=x.id)return;const d=new Date(v.d);if(b&&d>b){after+=v.q;return}if(!a||d>=a){inP+=v.q;if(v.t=='in')masuk+=v.q;else if(v.t=='out')keluar-=v.q;else adj+=v.q}});const akhir=r3(x.stok-after);return{n:x.n,u:x.u,awal:r3(akhir-inP),masuk:r3(masuk),keluar:r3(keluar),adj:r3(adj),akhir,nilai:akhir*x.c}})}
function stokRep(){const R=stkRep(SK);
$('#mb').innerHTML=`<div class="row n" style="justify-content:space-between;width:100%"><div class="row n">${[['mat','Bahan'],['prd','Produk jadi']].map(x=>`<button class="chip ${SK==x[0]?'on':''}" onclick="SK='${x[0]}';stokRep()">${x[1]}</button>`).join('')}</div><div class="row n"><button class="btn o s" onclick="share(stokText(),'Bagikan laporan stok ke WhatsApp')">Bagikan ke WA</button>${exb('stk')}</div></div>${rbar('stokRep')}<p style="color:var(--mut)">Periode: ${rlab()}. Stok awal = stok di awal periode. Stok akhir = stok di akhir periode (stok awal + masuk − keluar + penyesuaian/opname).</p>`+(R.length?`<div class="tw"><table><tr><th>Nama</th><th>Stok awal</th><th>Masuk</th><th>Keluar</th><th>Penyesuaian / opname</th><th>Stok akhir</th><th>Nilai akhir</th></tr>${R.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.awal} ${esc(x.u)}</td><td>${x.masuk}</td><td>${x.keluar}</td><td>${x.adj>0?'+':''}${x.adj}</td><td><b>${x.akhir}</b> ${esc(x.u)}</td><td>${rp(x.nilai)}</td></tr>`).join('')}<tr><td colspan="6"><b>Total nilai stok akhir</b></td><td><b>${rp(R.reduce((a,x)=>a+x.nilai,0))}</b></td></tr></table></div>`:'<p style="color:var(--mut)">Belum ada data.</p>')}
function stokText(){const R=stkRep(SK);return `*LAPORAN STOK ${SK=='mat'?'BAHAN':'PRODUK'} ${S.cfg.brand}*\nPeriode: ${rlab()}\n\n`+(R.length?R.map(x=>`• ${x.n}: awal ${x.awal}, masuk ${x.masuk}, keluar ${x.keluar}${x.adj?', opname '+(x.adj>0?'+':'')+x.adj:''}, akhir ${x.akhir} ${x.u}`).join('\n'):'-')}
Object.assign(B,{stk:()=>{const R=stkRep(SK);return{t:'Laporan stok '+(SK=='mat'?'bahan':'produk')+' '+rlab(),h:['Nama','Satuan','Stok awal','Masuk','Keluar','Penyesuaian','Stok akhir','Nilai akhir'],r:R.map(x=>[x.n,x.u,x.awal,x.masuk,x.keluar,x.adj,x.akhir,Math.round(x.nilai)])}}});
/* boot */
(async()=>{if(!S.users.length){S.users=[{u:'manager',p:await sha('manager123'),r:'manager'}];save()}paint();renderShop();
const pn=$('#pn');let n=0;const iv=setInterval(()=>{n+=Math.ceil(Math.random()*9);if(n>=100){n=100;clearInterval(iv);setTimeout(()=>$('#pre').classList.add('go'),250)}pn.textContent=n},50);
setInterval(()=>{if($('#store').style.display!='none'){si++;drawShow()}},4500);setTimeout(ppAuto,3300);
if(location.hash=='#office'){$('#store').style.display='none';$('#off').style.display='block';offInit()}
addEventListener('scroll',()=>{$('#prog').style.width=scrollY/(document.documentElement.scrollHeight-innerHeight||1)*100+'%'},{passive:true});
})();
</script></body></html>
